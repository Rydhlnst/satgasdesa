services:
  app:
    environment:
      NODE_ENV: production
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-filesystem}
      STORAGE_LOCAL_ROOT: ${STORAGE_LOCAL_ROOT:-public/uploads}
    volumes:
      - satgas_uploads:/app/public/uploads

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/vps/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  satgas_uploads:
  caddy_data:
  caddy_config:
